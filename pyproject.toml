[project]
name = "parallel-clamscan"
version = "0.1.0"
description = "Run clamscan in parallel over large directory trees."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas BARBIER" }]
keywords = ["clamav", "clamscan", "antivirus", "parallel", "scanner"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/elthommy/parallel_clamscan"
Issues = "https://github.com/elthommy/parallel_clamscan/issues"

[project.scripts]
pclamscan = "parallel_clamscan.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.7,<0.20"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
